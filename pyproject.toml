[project]
name = "langchain-agent-v1"
version = "0.1.0"
description = "LangChain 기반 상품 후기 분석 Tauri 데스크톱 앱과 학습 자료"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.0.0",
    "python-dotenv>=1.0.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "openai>=2.0.0",
    "langchain>=1.2.0",
    "langchain-core>=1.3.0",
    "langchain-community>=0.4.0",
    "langchain-text-splitters>=1.1.0",
    "langchain-google-genai>=4.0.0",
    "langchain-groq>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.0",
    "langchain-tavily>=0.2.0",
    "langgraph>=1.1.0",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.0.0",
    "tiktoken>=0.7.0",
    "pydantic>=2.7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "pyinstaller>=6.15.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["review_analyzer", "tests/review_analyzer"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
