[project]
name = "langchain-agent-v1"
version = "0.1.0"
description = "LangChain과 LLM 애플리케이션 패턴을 확인하는 Jupyter 프로젝트"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "openai>=2.0.0",
    "langchain>=1.2.0",
    "langchain-core>=1.3.0",
    "langchain-community>=0.4.0",
    "langchain-text-splitters>=1.1.0",
    "langchain-google-genai>=4.0.0",
    "langchain-groq>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.0",
    "langchain-tavily>=0.2.0",
    "langgraph>=1.1.0",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.0.0",
    "tiktoken>=0.7.0",
    "pydantic>=2.7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.5.0",
]
